<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 70" width="64" height="70">
  <defs>
    <linearGradient id="cg-main" x1="25%" y1="0%" x2="75%" y2="100%">
      <stop offset="0%"   stop-color="#AAB4FA"/>
      <stop offset="30%"  stop-color="#7B6EF5"/>
      <stop offset="65%"  stop-color="#3D52C8"/>
      <stop offset="100%" stop-color="#1A237E"/>
    </linearGradient>
    <linearGradient id="cg-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1A2480"/>
      <stop offset="45%"  stop-color="#3449B0"/>
      <stop offset="100%" stop-color="#1A2480"/>
    </linearGradient>
    <linearGradient id="cg-shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.45)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <linearGradient id="cg-left" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <linearGradient id="cg-base-shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.28)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- ══ Almenas izquierda ══ -->
  <rect x="9"  y="7"  width="6" height="9" rx="1.2" fill="url(#cg-main)"/>
  <rect x="17" y="7"  width="6" height="9" rx="1.2" fill="url(#cg-main)"/>

  <!-- ══ Almena central (más alta) ══ -->
  <rect x="27" y="3"  width="10" height="13" rx="1.4" fill="url(#cg-main)"/>

  <!-- ══ Almenas derecha ══ -->
  <rect x="41" y="7"  width="6" height="9" rx="1.2" fill="url(#cg-main)"/>
  <rect x="49" y="7"  width="6" height="9" rx="1.2" fill="url(#cg-main)"/>

  <!-- ══ Pilar izquierdo ══ -->
  <rect x="9"  y="15" width="15" height="38" rx="1" fill="url(#cg-main)"/>

  <!-- ══ Pilar derecho ══ -->
  <rect x="40" y="15" width="15" height="38" rx="1" fill="url(#cg-main)"/>

  <!-- ══ Travesaño central (crossbar) con fondo arqueado ══ -->
  <path d="M 24,20 H 40 V 27 Q 32,34 24,27 Z" fill="url(#cg-main)"/>

  <!-- ══ Brillo lateral izquierdo (efecto 3D) ══ -->
  <rect x="9"  y="7"  width="7"  height="46" rx="1" fill="url(#cg-left)"/>

  <!-- ══ Brillo superior (shine top) ══ -->
  <path d="M 27,3 H 37 V 10 H 27 Z" rx="1" fill="url(#cg-shine)" opacity="0.5"/>

  <!-- ══ Base / pedestal ══ -->
  <path d="M 6,53 L 58,53 L 53,63 L 11,63 Z" fill="url(#cg-base)"/>
  <!-- Base bevel shine -->
  <path d="M 6,53 L 58,53 L 56,57 L 8,57 Z"  fill="url(#cg-base-shine)"/>
  <!-- Base reflection dark -->
  <path d="M 11,63 L 53,63 L 51,67 L 13,67 Z" fill="rgba(26,35,126,0.6)"/>
</svg>
